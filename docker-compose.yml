services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studio"], interval: 5s, timeout: 5s, retries: 20 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://studio:studio@db:5432/studio
      SESSION_SECRET: change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NANO_BANANA_MODEL: gemini-3-pro-image-preview
    ports: [ "3000:3000" ]
    volumes: [ "storage:/app/storage" ]
volumes: { pgdata: {}, storage: {} }
